<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرسم — QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#15110e;--gold:#c9a46a;--gold2:#e3c28a;--text:#f5efe6;--muted:#b9ab9b;--line:rgba(201,164,106,.22)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Playfair Display',serif;background:radial-gradient(ellipse at top,#2a211a,#15110e 55%,#100d0b);color:var(--text);min-height:100vh;padding:24px}
    .wrap{max-width:980px;margin:0 auto}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
    .btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a120d;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:.95rem}
    .btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
    .sheet{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .brand{text-align:center;margin-bottom:22px}
    .logo{width:96px;height:96px;object-fit:cover;border-radius:24px;border:1px solid var(--line);margin:0 auto 14px;display:block}
    .eyebrow{color:var(--gold);letter-spacing:.22em;text-transform:uppercase;font-size:.75rem;margin-bottom:8px;font-family:Arial,sans-serif}
    h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1;margin-bottom:8px}
    .ar{font-family:Cairo,sans-serif;font-size:1.2rem;color:var(--gold2);margin-bottom:6px}
    .tag{color:var(--muted);font-family:Arial,sans-serif;font-size:1rem}
    .qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:28px}
    .qr-card{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}
    .qr-card img{width:100%;max-width:320px;margin:0 auto 14px;border-radius:16px;background:#fff;padding:10px}
    .qr-card h2{font-size:1.2rem;margin-bottom:4px}
    .qr-card p{color:var(--muted);font-family:Arial,sans-serif;font-size:.9rem}
    .url{margin-top:18px;text-align:center;color:var(--muted);font-family:Arial,sans-serif;font-size:.9rem;word-break:break-all}
    .stand{margin-top:28px;border:2px dashed rgba(201,164,106,.35);border-radius:24px;padding:28px;text-align:center;background:linear-gradient(180deg,rgba(201,164,106,.06),transparent)}
    .stand h2{font-size:2rem;margin-bottom:6px}
    .stand .scan{font-family:Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-size:.82rem;margin-bottom:14px}
    .stand img{width:min(320px,70vw);background:#fff;padding:12px;border-radius:18px;margin:0 auto 14px;display:block}
    .stand .name{font-size:2.4rem}
    .stand .sub{font-family:Cairo,sans-serif;color:var(--gold2);font-size:1.3rem;margin-top:4px}
    @media print{
      body{background:#fff;padding:0}
      .top{display:none}
      .sheet{box-shadow:none;border:1px solid #ccc;border-radius:0;background:#fff;color:#111}
      .tag,.qr-card p,.url,.ar,.eyebrow,.stand .scan{color:#333}
      .stand{border-color:#999}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn alt" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">← Menu</a>
        <button class="btn" onclick="window.print()">Imprimer / Print</button>
      </div>
      <div style="color:#b9ab9b;font-family:Arial,sans-serif;font-size:.9rem">مرسم — Didouche Mourad</div>
    </div>

    <div class="sheet">
      <div class="brand">
        <img src="assets/images/web_Screenshot_20261121_2023132.jpg" alt="Logo مرسم" class="logo" onerror="this.style.display='none'">
        <div class="eyebrow">Restaurant & Café</div>
        <h1>مرسم</h1>
        <div class="ar">قائمة رقمية</div>
        <div class="tag">Scannez pour découvrir notre menu</div>
      </div>

      <div class="qr-grid">
        <div class="qr-card">
          <img src="assets/qrcodes/qr-dark.png" alt="QR Code sombre">
          <h2>Version sombre</h2>
          <p>Aux couleurs du restaurant</p>
        </div>
        <div class="qr-card">
          <img src="assets/qrcodes/qr-bw.png" alt="QR Code noir et blanc">
          <h2>Noir & blanc</h2>
          <p>Haute précision pour impression</p>
        </div>
      </div>

      <div class="url">https://abouda10ranem-source.github.io/elmarsem-menu/</div>

      <div class="stand">
        <div class="scan">Scannez le menu</div>
        <img src="assets/qrcodes/qr-dark.png" alt="QR Menu مرسم">
        <div class="name">مرسم</div>
        <div class="sub">قائمة رقمية</div>
      </div>
    </div>
  </div>
</body>
</html>
